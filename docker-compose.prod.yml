services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobscout}
      POSTGRES_DB: ${POSTGRES_DB:-jobscout}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobscout}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/helloworld44-89/jobscout-backend:dev}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobscout}:${POSTGRES_PASSWORD:-jobscout}@db:5432/${POSTGRES_DB:-jobscout}
    command: uv run alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migration
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/helloworld44-89/jobscout-backend:dev}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobscout}:${POSTGRES_PASSWORD:-jobscout}@db:5432/${POSTGRES_DB:-jobscout}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
