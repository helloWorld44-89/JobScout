name: Deploy Dev

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jobscout-backend

jobs:
  # ── 1. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Run tests
        working-directory: backend
        run: uv run pytest

      - name: Clean up test artifacts
        if: always()
        working-directory: backend
        run: |
          rm -f test.db
          rm -rf .venv .pytest_cache
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

  # ── 2. Build & push image ──────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up Docker build environment
        if: always()
        run: |
          docker logout ghcr.io || true
          docker buildx rm --all-inactive -f || true
          docker image prune -f || true

  # ── 3. Deploy to dev VM via Ansible ───────────────────────────────────────
  deploy:
    name: Deploy to dev VM
    needs: build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Write .env for dev VM
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: printf '%s' "$DEV_ENV_FILE" > /tmp/jobscout-dev.env

      - name: Run Ansible deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_IMAGE: ${{ env.IMAGE }}:dev
        run: |
          ansible-playbook ansible/deploy-dev.yml \
            -i ansible/inventory/hosts.ini \
            -e "backend_image=$DEPLOY_IMAGE" \
            -e "ghcr_username=${{ github.actor }}" \
            -e "ghcr_password=$GHCR_TOKEN" \
            -e "env_file_src=/tmp/jobscout-dev.env"

      - name: Clean up
        if: always()
        run: |
          rm -f /tmp/jobscout-dev.env
          rm -rf "$GITHUB_WORKSPACE"
